name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test tests/Aos.Core.Tests -c Release --nologo

      - name: Build app (x64)
        run: dotnet build src/Aos.App -c Release -p:Platform=x64 --nologo
